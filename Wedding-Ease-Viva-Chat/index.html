<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme boot — runs before React mounts to kill the dark-mode flash
         on cold reload (Sprint 4, Hana, fixes Marcus QA C-2). Reads the
         persisted theme synchronously and applies the `dark` class to <html>. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('easebot-theme');
          if (t !== 'system' && t !== 'light' && t !== 'dark') t = 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) { /* private mode / no storage */ }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>EaseBot AI - Your Personal Wedding Planning Assistant</title>
    <meta name="description" content="EaseBot AI helps you plan your perfect wedding with personalized guidance, expert tips, and 24/7 support." />
    <meta name="author" content="EaseBot" />

    <!-- Mobile browser chrome color (Android Chrome / Safari iOS 15+) -->
    <meta name="theme-color" content="#3A0E20" />
    <meta name="color-scheme" content="dark" />

    <!-- iOS PWA / add-to-home-screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EaseBot" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Google Fonts (Stitch: Noto Serif + Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Material Symbols (Stitch icon set) -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <!-- Preload background image for immediate loading -->
    <link rel="preload" href="/images/IMG_3917.PNG" as="image" type="image/png" />

    <meta property="og:title" content="EaseBot AI - Your Personal Wedding Planning Assistant" />
    <meta property="og:description" content="EaseBot AI helps you plan your perfect wedding with personalized guidance, expert tips, and 24/7 support." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.ico" />
    <meta property="og:url" content="https://weddingease.ai/">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@weddingease_ai" />
    <meta name="twitter:image" content="/favicon.ico" />

    <link rel="manifest" href="/manifest.json">
    <link rel="canonical" href="https://weddingease.ai/">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "EaseBot AI",
      "applicationCategory": "LifestyleApplication",
      "operatingSystem": "Web",
      "description": "AI-powered wedding planning assistant with personalized guidance, style recommendations, budget tracking, and 24/7 support.",
      "offers": [
        {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "name": "Free"
        },
        {
          "@type": "Offer",
          "price": "1",
          "priceCurrency": "INR",
          "name": "Pro"
        },
        {
          "@type": "Offer",
          "price": "39",
          "priceCurrency": "USD",
          "name": "Pro Max"
        }
      ],
      "author": {
        "@type": "Organization",
        "name": "WeddingEase",
        "url": "https://weddingease.ai"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
