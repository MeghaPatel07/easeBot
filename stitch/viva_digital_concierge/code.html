<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-low": "#f5f3ef",
              "surface-tint": "#8A9A5B",
              "on-background": "#2c2e2a",
              "inverse-primary": "#d1e6a4",
              "on-primary-fixed": "#1a1f0e",
              "primary-fixed-dim": "#b9ce8d",
              "surface-container-high": "#ebe7df",
              "outline-variant": "#c9c9c1",
              "primary-container": "#d6e0b3",
              "error": "#ba1a1a",
              "surface-container": "#f0ede6",
              "tertiary-fixed-dim": "#a2ccd0",
              "secondary-fixed-dim": "#c2c9bd",
              "on-secondary-container": "#1d211a",
              "background": "#fdfbf7",
              "on-primary-fixed-variant": "#4a5332",
              "surface-dim": "#e0ddd5",
              "primary": "#8A9A5B",
              "tertiary": "#4a6365",
              "on-tertiary-container": "#071e21",
              "surface-container-lowest": "#ffffff",
              "on-surface": "#1b1c18",
              "secondary": "#5d6254",
              "secondary-fixed": "#e2e8d9",
              "surface": "#fdfbf7",
              "surface-container-highest": "#e5e2da",
              "tertiary-fixed": "#cde7eb",
              "on-tertiary-fixed-variant": "#334b4e",
              "on-tertiary-fixed": "#001f22",
              "tertiary-container": "#d2e8ea",
              "error-container": "#ffdad6",
              "on-secondary": "#ffffff",
              "on-surface-variant": "#474842",
              "secondary-container": "#e2e8d9",
              "primary-fixed": "#e6f2cf",
              "on-tertiary": "#ffffff",
              "on-primary": "#ffffff",
              "inverse-surface": "#31312c",
              "on-secondary-fixed-variant": "#464a3e",
              "inverse-on-surface": "#f4f1ea",
              "surface-variant": "#e5e2da",
              "on-error-container": "#93000a",
              "on-primary-container": "#2c3319",
              "surface-bright": "#fdfbf7",
              "on-error": "#ffffff",
              "outline": "#777870",
              "on-secondary-fixed": "#1a1e17"
            },
            fontFamily: {
              "headline": ["Noto Serif"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24
      }
      .bg-hero-universal {
        background: radial-gradient(circle at top left, #f5f1e8 0%, #e2e8d9 100%);
        background-attachment: fixed;
      }
      .glass-panel {
        backdrop-filter: blur(12px);
        background-color: rgba(255, 255, 255, 0.9);
      }
    </style>
</head>
<body class="font-body bg-hero-universal text-on-surface min-h-screen flex items-center justify-center p-4">
<!-- Modal Container -->
<div class="relative w-full max-w-[480px]">
<!-- Main Sign In Modal -->
<div class="glass-panel rounded-[2rem] p-10 md:p-14 shadow-[0_32px_64px_-12px_rgba(44,46,42,0.1)] border border-white/60">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-10">
<div class="text-[2.5rem] font-headline italic font-bold text-primary tracking-tight leading-none mb-1">TheWeddingBot</div>
<div class="font-label uppercase tracking-[0.2em] text-[10px] text-on-surface-variant/60">Digital Concierge</div>
</div>
<!-- Welcome Text -->
<div class="text-center mb-10">
<h1 class="font-headline text-3xl md:text-4xl text-on-surface tracking-tight mb-3">Welcome back</h1>
<p class="text-on-surface-variant text-sm font-body">Your wedding planning journey continues here.</p>
</div>
<!-- Form -->
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label uppercase tracking-widest text-[11px] text-on-surface-variant ml-1">Email Address</label>
<input class="w-full h-14 px-6 rounded-xl bg-surface-container-high border-none focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all placeholder:text-outline/40" placeholder="alex@example.com" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-end px-1">
<label class="font-label uppercase tracking-widest text-[11px] text-on-surface-variant">Password</label>
<a class="text-[11px] text-primary font-semibold hover:underline" href="#">Forgot?</a>
</div>
<input class="w-full h-14 px-6 rounded-xl bg-surface-container-high border-none focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all placeholder:text-outline/40" placeholder="••••••••" type="password"/>
</div>
<!-- Primary CTA -->
<button class="w-full h-14 rounded-xl bg-primary text-on-primary font-semibold tracking-wide shadow-lg shadow-primary/20 hover:bg-primary/90 transition-all flex items-center justify-center gap-2" type="submit">
                Sign in
                <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 my-8">
<div class="h-[1px] flex-1 bg-outline-variant/50"></div>
<span class="font-label uppercase tracking-widest text-[10px] text-outline">or</span>
<div class="h-[1px] flex-1 bg-outline-variant/50"></div>
</div>
<!-- Social Provider -->
<button class="w-full h-14 rounded-xl bg-surface-container-lowest border border-outline-variant/30 flex items-center justify-center gap-3 text-on-surface font-medium hover:bg-white hover:border-outline-variant transition-all">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
</svg>
            Continue with Google
        </button>
<!-- Footer Link -->
<div class="mt-10 text-center">
<p class="text-on-surface-variant text-sm">
                Don't have an account? 
                <a class="text-primary font-bold ml-1 hover:underline" href="#">Sign up</a>
</p>
</div>
</div>
<!-- Decorative Elements (Subtle & Thematic) -->
<div class="absolute -top-12 -right-12 w-32 h-32 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-16 -left-16 w-48 h-48 bg-secondary/10 rounded-full blur-3xl pointer-events-none"></div>
</div>
</body></html>
