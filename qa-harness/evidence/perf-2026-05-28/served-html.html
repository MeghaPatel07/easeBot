<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <!-- Theme boot — runs before React mounts to kill the theme-swap flash
         on cold reload. Reads the persisted theme synchronously and applies
         either the `light` or `dark` class to <html>. Default is `light`.
         Also sets color-scheme so native form controls / scrollbars track. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('easebot-theme');
          if (t !== 'system' && t !== 'light' && t !== 'dark') t = 'light';
          var resolved = t;
          if (t === 'system') {
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var root = document.documentElement;
          root.classList.toggle('dark', resolved === 'dark');
          root.classList.toggle('light', resolved === 'light');
          root.style.colorScheme = resolved;
        } catch (e) { /* private mode / no storage */ }
      })();
    </script>
